<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Robot Face Emotions</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(to bottom right, #e6ecf0, #b6c8d6); 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .robot {
      width: 220px;
      height: 180px;
      background: linear-gradient(145deg, #cfd8e3, #8b9db1); 
      border-radius: 50px;
      position: relative;
      animation: float 4s ease-in-out infinite;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); 
      overflow: hidden;
    }

    .robot::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      width: 80%;
      height: 50%;
      background: radial-gradient(ellipse at top, rgba(255, 255, 255, 0.15), transparent 70%);
      border-radius: 50% 50% 0 0;
      pointer-events: none;
    }

    .visor {
      width: 140px;
      height: 60px;
      background: radial-gradient(circle at 60% 40%, #424242, #1c1c1c); 
      border-radius: 30px;
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: inset -3px -3px 8px rgba(255, 255, 255, 0.1),
                  inset 3px 3px 8px rgba(0, 0, 0, 0.6),
                  0 0 12px rgba(0, 255, 255, 0.15); 
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .visor::before {
      content: '';
      position: absolute;
      top: 0;
      left: -60%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0,255,255,0.2), transparent);
      animation: scan 4s linear infinite;
      z-index: 1;
    }

    .eye {
      width: 12px;
      height: 12px;
      background: #00ffff;
      border-radius: 50%;
      animation: blink 5s infinite;
      box-shadow: 0 0 8px #00ffff;
      transition: all 0.4s ease;
      position: relative;
      z-index: 2;
    }


    .happy .eye {
      border-radius: 50% 50% 0 0;
      background: #00ffcc;
      transform: rotate(180deg);
      height: 8px;
      width: 18px;
      box-shadow: 0 2px 8px #00ffcc;
    }

    .sad .eye {
      border-radius: 0 0 50% 50%;
      background: #0099ff;
      height: 8px;
      width: 18px;
      box-shadow: 0 2px 8px #0099ff;
    }

    .angry .eye {
      transform: rotate(-20deg);
      background: #ff3333;
      width: 12px;
      height: 12px;
      box-shadow: 0 0 10px #ff3333;
    }

    .surprised .eye {
      background: #00ffff;
      width: 18px;
      height: 18px;
      box-shadow: 0 0 15px #00ffff;
    }

    .thinking .eye {
      animation: thinking 1.2s infinite alternate;
      box-shadow: 0 0 10px #00ccff;
    }

    .sleeping .eye {
      width: 18px;
      height: 2px;
      border-radius: 2px;
      background: #ccc;
      box-shadow: none;
      animation: none;
    }

    .typing .eye {
      width: 14px;
      height: 14px;
      animation: typing 0.3s ease-in-out infinite alternate;
      background: #ffea00;
      box-shadow: 0 0 15px #ffea00;
    }


    .glow {
      position: absolute;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 20px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, transparent 70%);
      filter: blur(6px);
      animation: glow-fade 4s ease-in-out infinite;
    }

  
    .controls {
      position: absolute;
      bottom: 30px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .controls button {
      padding: 6px 12px;
      font-size: 14px;
      border: none;
      background: #444;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .controls button:hover {
      background: #0099aa;
    }

  
    @keyframes blink {
      0%, 95%, 100% { opacity: 1; transform: scale(1); }
      97% { opacity: 0.1; transform: scaleY(0.3); }
    }

    @keyframes thinking {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.3); opacity: 1; }
    }

    @keyframes typing {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes scan {
      0% { left: -60%; }
      100% { left: 100%; }
    }

    @keyframes glow-fade {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.7; }
    }
  </style>
</head>
<body>

  <div class="robot">
    <div class="visor" id="visor">
      <div class="eye"></div>
      <div class="eye"></div>
    </div>
    <div class="glow"></div>
  </div>


  <div class="controls">
    <button onclick="setEmotion('neutral')">Neutral</button>
    <button onclick="setEmotion('happy')">Happy</button>
    <button onclick="setEmotion('sad')">Sad</button>
    <button onclick="setEmotion('surprised')">Surprised</button>
    <button onclick="setEmotion('angry')">Angry</button>
    <button onclick="setEmotion('thinking')">Thinking</button>
    <button onclick="setEmotion('sleeping')">Sleeping</button>
    <button onclick="setEmotion('typing')">Typing</button>
  </div>

  <script>
    const visor = document.getElementById('visor');

    function setEmotion(emotion) {
      visor.className = 'visor ' + emotion;
    }


    setEmotion('neutral');
  </script>

</body>
</html>
